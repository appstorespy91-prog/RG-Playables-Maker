[package]
name = "playableforge"
version = "1.0.0"
description = "Professional Unity WebGL to Playable Ad converter for mobile ad networks"
authors = ["PlayableForge"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "playableforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
which = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
